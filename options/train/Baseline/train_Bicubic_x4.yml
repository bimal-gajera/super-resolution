# Interpolation baseline: learned linear band->RGB colour map (1x1 conv) + bicubic upsampling.

# general settings
name: Bicubic_x4_S2Maxar_linearcolor_5k_B16G1
model_type: SRModel
scale: 4
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: S2Maxar_train
    type: S2MaxarDataset
    dataroot: datasets/s2maxar
    meta_info_file: datasets/s2maxar/meta_info/train_clean.txt
    io_backend:
      type: npy            # memory-mapped cache from scripts/prepare_s2maxar.py
    lq_source: s2          # s2 | bicubic (synthetic LR = bicubic-downsampled GT; pipeline sanity check)
    lq_bands: ~            # ~ = all 12 L2A bands (B01..B12, no B10); e.g. [3, 2, 1] for RGB only
    lq_norm: meanstd       # per-band z-score (stats.json) | reflectance (/10000)

    gt_size: 192           # HR crop; 192 = the full x4 tile
    use_hflip: true
    use_rot: true

    # data loader
    num_worker_per_gpu: 4
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
    pin_memory: true
    persistent_workers: true

  val:
    name: S2Maxar_val
    type: S2MaxarDataset
    dataroot: datasets/s2maxar
    meta_info_file: datasets/s2maxar/meta_info/val_clean.txt
    max_samples: 500       # evenly spaced subset keeps validation fast; the test configs use the full list
    io_backend:
      type: npy
    lq_norm: meanstd
    batch_size_per_gpu: 16
    num_worker_per_gpu: 2

# network structures
network_g:
  type: BicubicBaseline
  num_in_ch: 12            # = len(lq_bands)
  num_out_ch: 3
  scale: 4

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0
  optim_g:
    type: Adam
    lr: !!float 1e-3
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [5000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  total_iter: 5000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 1e3
  save_img: true
  max_save_img: 8          # LR | SR | GT panels for the first 8 val tiles
  save_best: psnr          # keep models/net_g_best.pth (EMA weights)

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e3
  use_tb_logger: true
  wandb:                 # W&B mirrors tensorboard; set project to enable (needs `wandb login`)
    project: ~
    entity: ~              # W&B user/team; ~ = your default
    group: ~
    resume_id: ~           # normally ~: resumed jobs reuse experiments/<name>/wandb_id.txt

# dist training settings
dist_params:
  backend: nccl
  port: 29500
