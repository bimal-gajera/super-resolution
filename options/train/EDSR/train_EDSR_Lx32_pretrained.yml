# [pretrained-init variant of train_EDSR_Lx32.yml, generated by scripts/make_pretrained_configs.py; the header below describes the scratch run]
# init: EDSR_Lx4_f256b32_DIV2K_official.pth (official RGB model, scripts/download_pretrained.py); recipe as in the scratch run.
# [x32 variant of train_EDSR_Lx4.yml, generated by scripts/make_scale_configs.py; the header below describes x4]
# x32: random crops LR 16 px -> HR 512 px (x4: whole tiles); validation on whole tiles (48 -> 1536 px).
# EDSR (EDSR-L: 32 residual blocks, 256 features, res_scale 0.1 as in the paper), L1 only.
# Reference: BasicSR options/train/EDSR/train_EDSR_Lx4.yml (DIV2K, 300k iters, lr 1e-4 halved at 200k, x4 initialised
# from the x2 model). Here: trained from scratch (no x2 stage), same batch 16 x 300k budget as RRDBNet and SwinIR.
# V100 measurement: bs16 = 5.4 GB peak, 0.36 s/iter -> ~30 h (relaunch with --auto_resume to continue).

# general settings
name: EDSR_Lx32_S2Maxar_f256b32_300k_B16G1_pretrained
model_type: SRModel
scale: 32
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: S2Maxar_train
    type: S2MaxarDataset
    dataroot: datasets/s2maxar
    meta_info_file: datasets/s2maxar/meta_info/train_clean.txt
    io_backend:
      type: npy
    lq_source: s2
    lq_bands: ~
    lq_norm: meanstd

    gt_size: 512           # random HR crop of LR 16 px
    use_hflip: true
    use_rot: true

    # data loader
    num_worker_per_gpu: 4
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
    pin_memory: true
    persistent_workers: true

  val:
    name: S2Maxar_val
    type: S2MaxarDataset
    dataroot: datasets/s2maxar
    meta_info_file: datasets/s2maxar/meta_info/val_clean.txt
    max_samples: 500
    io_backend:
      type: npy
    lq_norm: meanstd
    batch_size_per_gpu: 2
    num_worker_per_gpu: 2

# network structures
network_g:
  type: EDSR
  num_in_ch: 12            # = len(lq_bands)
  num_out_ch: 3
  num_feat: 256
  num_block: 32
  upscale: 32
  res_scale: 0.1
  img_range: 255.
  rgb_mean: [0.4488, 0.4371, 0.4040]  # added to the RGB output only; the z-scored S2 input is already zero-mean

# path
path:
  pretrain_network_g: experiments/pretrained_models/EDSR_Lx4_f256b32_DIV2K_official.pth
  pretrain_rgb_input:  # RGB filters of conv_first -> B04, B03, B02 (other bands start at 0), docs/02 §2.2
    channels: [3, 2, 1]
    mean: [0.4132, 0.37, 0.3298]  # a z-scored band is shown to the RGB model as mean + std * z
    std: [0.2123, 0.1501, 0.1281]  # (Maxar RGB statistics, datasets/s2maxar/stats.json)
    rgb_mean: [0.4488, 0.4371, 0.404]  # subtracted from the input by the RGB model (DIV2K mean)
  strict_load_g: false  # layers missing from the checkpoint (x2 stages above its scale) stay random
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [200000]
    gamma: 0.5

  total_iter: 300000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 5e3
  save_img: true
  max_save_img: 8
  save_best: psnr

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 32
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 32
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:                 # W&B mirrors tensorboard; set project to enable (needs `wandb login`)
    project: ~
    entity: ~              # W&B user/team; ~ = your default
    group: ~
    resume_id: ~           # normally ~: resumed jobs reuse experiments/<name>/wandb_id.txt

# dist training settings
dist_params:
  backend: nccl
  port: 29500
