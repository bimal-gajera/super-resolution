# [pretrained-init variant of train_RRDBNet_PSNR_x32.yml, generated by scripts/make_pretrained_configs.py; the header below describes the scratch run]
# init: ESRGAN_PSNR_SRx4_DF2K_official.pth (official RGB model, scripts/download_pretrained.py); recipe as in the scratch run.
# [x32 variant of train_RRDBNet_PSNR_x4.yml, generated by scripts/make_scale_configs.py; the header below describes x4]
# x32: random crops LR 16 px -> HR 512 px (x4: whole tiles); validation on whole tiles (48 -> 1536 px).
# ESRGAN stage 1: PSNR-oriented RRDBNet (L1 only). Stage 2 (train_ESRGAN_x4.yml) starts from this model.
# Reference: BasicSR options/train/ESRGAN/train_RRDBNet_PSNR_x4.yml (DIV2K, 1M iters, cosine restarts).
# Here: Sentinel-2 L2A (12 bands, 10 m, 48 px) -> Maxar RGB at 2.5 m (192 px).
# Budget: batch 16 x 300k iters, identical to the SwinIR config for a controlled comparison
# (~0.31 s/iter on one V100-16GB -> ~26 h; relaunch with --auto_resume to continue after the walltime).

# general settings
name: RRDBNet_PSNR_x32_S2Maxar_f64b23_300k_B16G1_pretrained
model_type: SRModel
scale: 32
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: S2Maxar_train
    type: S2MaxarDataset
    dataroot: datasets/s2maxar
    meta_info_file: datasets/s2maxar/meta_info/train_clean.txt
    io_backend:
      type: npy            # memory-mapped cache from scripts/prepare_s2maxar.py
    lq_source: s2          # s2 | bicubic (synthetic LR = bicubic-downsampled GT; pipeline sanity check)
    lq_bands: ~            # ~ = all 12 L2A bands (B01..B12, no B10); e.g. [3, 2, 1] for RGB only
    lq_norm: meanstd       # per-band z-score (stats.json) | reflectance (/10000)

    gt_size: 512           # random HR crop of LR 16 px
    use_hflip: true
    use_rot: true

    # data loader
    num_worker_per_gpu: 4
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
    pin_memory: true
    persistent_workers: true

  val:
    name: S2Maxar_val
    type: S2MaxarDataset
    dataroot: datasets/s2maxar
    meta_info_file: datasets/s2maxar/meta_info/val_clean.txt
    max_samples: 500       # evenly spaced subset keeps validation fast; the test configs use the full list
    io_backend:
      type: npy
    lq_norm: meanstd
    batch_size_per_gpu: 2
    num_worker_per_gpu: 2

# network structures
network_g:
  type: RRDBNet
  num_in_ch: 12            # = len(lq_bands)
  num_out_ch: 3
  scale: 32
  num_feat: 64
  num_block: 23
  num_grow_ch: 32

# path
path:
  pretrain_network_g: experiments/pretrained_models/ESRGAN_PSNR_SRx4_DF2K_official.pth
  pretrain_rgb_input:  # RGB filters of conv_first -> B04, B03, B02 (other bands start at 0), docs/02 §2.2
    channels: [3, 2, 1]
    mean: [0.4132, 0.37, 0.3298]  # a z-scored band is shown to the RGB model as mean + std * z
    std: [0.2123, 0.1501, 0.1281]  # (Maxar RGB statistics, datasets/s2maxar/stats.json)
  strict_load_g: false  # layers missing from the checkpoint (x2 stages above its scale) stay random
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [300000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  total_iter: 300000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 5e3
  save_img: true
  max_save_img: 8          # LR | SR | GT panels for the first 8 val tiles
  save_best: psnr          # keep models/net_g_best.pth (EMA weights)

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 32
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 32
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:                 # W&B mirrors tensorboard; set project to enable (needs `wandb login`)
    project: ~
    entity: ~              # W&B user/team; ~ = your default
    group: ~
    resume_id: ~           # normally ~: resumed jobs reuse experiments/<name>/wandb_id.txt

# dist training settings
dist_params:
  backend: nccl
  port: 29500
