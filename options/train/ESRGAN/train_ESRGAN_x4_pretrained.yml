# [pretrained-init variant of train_ESRGAN_x4.yml, generated by scripts/make_pretrained_configs.py; the header below describes the scratch run]
# init: the pretrained stage-1 run (RRDBNet_PSNR ..._pretrained); recipe as in the scratch run.
# ESRGAN stage 2: RRDBNet + VGG-style discriminator (relativistic GAN) + VGG19 perceptual loss,
# initialised from the stage-1 PSNR model (train_RRDBNet_PSNR_x4.yml). Loss weights as in BasicSR / the paper.
# Reference: BasicSR options/train/ESRGAN/train_ESRGAN_x4.yml (400k iters, milestones 50k/100k/200k/300k).
# Here: 200k iters with the milestones compressed accordingly.

# general settings
name: ESRGAN_x4_S2Maxar_f64b23_200k_B16G1_PSNRinit_pretrained
model_type: ESRGANModel
scale: 4
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: S2Maxar_train
    type: S2MaxarDataset
    dataroot: datasets/s2maxar
    meta_info_file: datasets/s2maxar/meta_info/train_clean.txt
    io_backend:
      type: npy
    lq_source: s2
    lq_bands: ~
    lq_norm: meanstd

    gt_size: 192           # must equal network_d.input_size
    use_hflip: true
    use_rot: true

    # data loader
    num_worker_per_gpu: 4
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
    pin_memory: true
    persistent_workers: true

  val:
    name: S2Maxar_val
    type: S2MaxarDataset
    dataroot: datasets/s2maxar
    meta_info_file: datasets/s2maxar/meta_info/val_clean.txt
    max_samples: 500
    io_backend:
      type: npy
    lq_norm: meanstd
    batch_size_per_gpu: 16
    num_worker_per_gpu: 2

# network structures
network_g:
  type: RRDBNet
  num_in_ch: 12
  num_out_ch: 3
  scale: 4
  num_feat: 64
  num_block: 23
  num_grow_ch: 32

network_d:
  type: VGGStyleDiscriminator
  num_in_ch: 3
  num_feat: 64
  input_size: 192

# path
path:
  # stage-1 result; params_ema = the EMA weights (also used for net_g_ema)
  pretrain_network_g: experiments/RRDBNet_PSNR_x4_S2Maxar_f64b23_300k_B16G1_pretrained/models/net_g_latest.pth
  param_key_g: params_ema
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  optim_d:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [50000, 100000, 150000]
    gamma: 0.5

  total_iter: 200000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: !!float 1e-2
    reduction: mean
  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      'conv5_4': 1  # before relu
    vgg_type: vgg19
    use_input_norm: true
    range_norm: false
    perceptual_weight: 1.0
    style_weight: 0
    criterion: l1
  gan_opt:
    type: GANLoss
    gan_type: vanilla
    real_label_val: 1.0
    fake_label_val: 0.0
    loss_weight: !!float 5e-3

  net_d_iters: 1
  net_d_init_iters: 0

# validation settings
val:
  val_freq: !!float 5e3
  save_img: true
  max_save_img: 8
  save_best: lpips         # perceptual model -> keep the best LPIPS checkpoint

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false
    lpips:
      type: calculate_lpips
      crop_border: 4
      better: lower

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:                 # W&B mirrors tensorboard; set project to enable (needs `wandb login`)
    project: ~
    entity: ~              # W&B user/team; ~ = your default
    group: ~
    resume_id: ~           # normally ~: resumed jobs reuse experiments/<name>/wandb_id.txt

# dist training settings
dist_params:
  backend: nccl
  port: 29500
