# [x8 variant of train_SwinIR_SRx4_scratch.yml] bs16 does not fit a 16 GB V100 (bs8: 9.0 GB, 0.29 s/iter) -> use a
# 32 GB GPU (the sbatch default v100-32), or use_checkpoint: true.
# SwinIR classical SR (x8, pixelshuffle, embed 180, 6x6 RSTB), trained from scratch with L1.
# Reference: BasicSR options/train/SwinIR/train_SwinIR_SRx4_scratch.yml (DIV2K, LR patch 48, window 8,
# batch 4/GPU x 8 GPUs, 500k iters, milestones at 50/80/90/95 %).
# Here: 12 S2 bands in, RGB out; batch 16 x 300k iters (same budget as the RRDBNet PSNR config),
# milestones at the same fractions. bs16 uses ~14.3 GB -> fits a V100-16GB (~0.5 s/iter -> ~42 h, use
# --auto_resume to chain jobs). For the official total batch of 32 run 2 GPUs x 16 with torchrun.

# general settings
name: SwinIR_SRx8_S2Maxar_P48W8_300k_B16G1
model_type: SwinIRModel
scale: 8
num_gpu: auto
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: S2Maxar_train
    type: S2MaxarDataset
    dataroot: datasets/s2maxar
    meta_info_file: datasets/s2maxar/meta_info/train_clean.txt
    io_backend:
      type: npy
    lq_source: s2
    lq_bands: ~
    lq_norm: meanstd

    gt_size: 384           # = LR patch 48, the full x8 tile
    use_hflip: true
    use_rot: true

    # data loader
    num_worker_per_gpu: 4
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
    pin_memory: true
    persistent_workers: true

  val:
    name: S2Maxar_val
    type: S2MaxarDataset
    dataroot: datasets/s2maxar
    meta_info_file: datasets/s2maxar/meta_info/val_clean.txt
    max_samples: 500
    io_backend:
      type: npy
    lq_norm: meanstd
    batch_size_per_gpu: 16
    num_worker_per_gpu: 2

# network structures
network_g:
  type: SwinIR
  upscale: 8
  in_chans: 12             # = len(lq_bands)
  out_chans: 3
  img_size: 48
  window_size: 8
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'
  use_checkpoint: false    # true trades ~30 % speed for much less memory (bigger batches)

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [150000, 240000, 270000, 285000]
    gamma: 0.5

  total_iter: 300000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 5e3
  save_img: true
  max_save_img: 8
  save_best: psnr

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 8
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 8
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:                 # W&B mirrors tensorboard; set project to enable (needs `wandb login`)
    project: ~
    entity: ~              # W&B user/team; ~ = your default
    group: ~
    resume_id: ~           # normally ~: resumed jobs reuse experiments/<name>/wandb_id.txt

# dist training settings
dist_params:
  backend: nccl
  port: 29500
